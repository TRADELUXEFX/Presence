plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKsPath = System.getenv('KEYSTORE_FILE')
def hasReleaseKs = releaseKsPath && new File(releaseKsPath).exists()
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()

android {
    namespace 'com.presence.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.presence.app"
        minSdk 24
        targetSdk 34
        versionCode 1000 + runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            if (hasReleaseKs) {
                storeFile new File(releaseKsPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Falls back to the debug key if the keystore secrets are missing.
            signingConfig hasReleaseKs ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// The web app lives in <repo>/www. MainActivity loads it from the APK at
// assets/www/index.html, so www/ must be packed into the APK's assets.
// Without this the WebView gets ERR_INVALID_RESPONSE (nothing to serve).
def wwwSrc = rootProject.file('www')
def wwwOut = layout.buildDirectory.dir('generated/www-assets').get().asFile

def copyWww = tasks.register('copyWww', Copy) {
    doFirst {
        if (!new File(wwwSrc, 'index.html').exists()) {
            throw new GradleException("www/index.html is missing - the app would open blank.")
        }
    }
    from(wwwSrc) {
        exclude 'sw.js', 'clear.html', '.nojekyll'
    }
    into new File(wwwOut, 'www')
}

android.sourceSets.main.assets.srcDir(wwwOut)
tasks.named('preBuild') { dependsOn copyWww }

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
