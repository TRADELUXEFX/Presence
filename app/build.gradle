plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKsPath = System.getenv('KEYSTORE_FILE')
def hasReleaseKs = releaseKsPath && new File(releaseKsPath).exists()
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()

android {
    namespace 'com.presence.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.presense.app"
        minSdk 24
        targetSdk 36
        versionCode 1000 + runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            if (hasReleaseKs) {
                storeFile new File(releaseKsPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Same release key as the installed Presense app, so this installs over it.
            // Falls back to the debug key only if the keystore secrets are missing.
            signingConfig signingConfigs.release
            // R8 minification: shrinks and renames the code, and drops resources nothing uses (smaller APK)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}

// A release build without the keystore secrets would be signed with the debug key, which will not
// install over the app already on the phone. Stop with a clear message instead.
gradle.taskGraph.whenReady { graph ->
    if ((graph.hasTask(':app:assembleRelease') || graph.hasTask(':app:bundleRelease')) && !hasReleaseKs) {
        throw new GradleException(
            "Release keystore is missing. Add the GitHub secrets ANDROID_KEYSTORE_BASE64, " +
            "KEYSTORE_PASSWORD and KEY_PASSWORD (same key as the installed app), then rebuild.")
    }
}
